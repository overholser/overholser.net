<nav class="pv3 ph3 ph4-ns" role="navigation">
  <div class="flex justify-between items-center center nav-container">
    <a href="{{ .Site.BaseURL }}" class="f3 fw5 hover-white no-underline white-90 dib site-title">
      {{ .Site.Title }}
    </a>
    <button class="nav-toggle bg-transparent bn white-90 f3 pointer pa2" aria-label="Toggle menu" aria-controls="nav-menu" aria-expanded="false" onclick="var m=document.getElementById('nav-menu');var open=m.classList.toggle('nav-open');this.setAttribute('aria-expanded',open);">
      &#9776;
    </button>
    <div id="nav-menu" class="nav-menu">
      {{ partial "i18nlist.html" . }}
      {{ if .Site.Menus.main }}
        <ul class="pl0 list">
          {{ range .Site.Menus.main }}
          {{ $active := eq $.RelPermalink (.URL | relURL) }}
          <li class="nav-item">
            <a class="hover-white no-underline white-90" href="{{ .URL }}" title="{{ .Name }} page"{{ if $active }} aria-current="page"{{ end }}>
              {{ .Name }}
            </a>
          </li>
          {{ end }}
        </ul>
      {{ end }}
      {{ partial "social-follow.html" . }}
    </div>
  </div>
</nav>
