baseURL = "https://overholser.net"
languageCode = "en-us"
title = "Overholser Family Association"
theme = "ananke"
disableKinds = ["taxonomy", "term"]

[params]
  env = "production"
  favicon = "favicon.png"
  background_color_class = "bg-dark-brown"
  custom_css = ["css/custom.css"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]

  [[menu.main]]
    name = "Home"
    url = "/"
    weight = -1

  [[menu.main]]
    name = "Library"
    url = "/library/"
    weight = 1

  [[menu.main]]
    name = "Reunions"
    url = "/reunions/"
    weight = 2

  [[menu.main]]
    name = "Membership"
    url = "/membership/"
    weight = 3

  [[menu.main]]
    name = "Lookups"
    url = "/lookups/"
    weight = 4

  [[menu.main]]
    name = "Obituaries"
    url = "/obituaries/"
    weight = 5

  [[menu.main]]
    name = "Links"
    url = "/links/"
    weight = 6

  [[menu.main]]
    name = "History"
    url = "/history/"
    weight = 7

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 8

  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 9
